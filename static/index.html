<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Udemy Transcript</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385; --border: #e2e5ea;
    --accent: #a435f0; --accent-ink: #fff; --ok: #1e8e3e; --warn: #b26a00; --err: #c5221f;
    --code: #f0f1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1d2027; --text: #e6e8ec; --muted: #9aa1b0; --border: #2e323b;
      --accent: #c27cf6; --accent-ink: #14161b; --ok: #5fcf80; --warn: #f0b45a; --err: #f28b82;
      --code: #262a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password] { flex: 1 1 320px; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
  details ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .bar { height: 8px; background: var(--code); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  pre.log { background: var(--code); border-radius: 6px; padding: 10px; max-height: 260px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 0; }
  .course { border-top: 1px solid var(--border); padding: 12px 0; }
  .course:first-of-type { border-top: 0; padding-top: 0; }
  .course .title { font-weight: 600; }
  .course .links { margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  a { color: var(--accent); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--code); margin-right: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <h1>Udemy Transcript</h1>
    <div class="row">
      <span class="row" id="portableBar" hidden>
        <button id="openData" data-i18n="open_data" data-i18n-title="open_data_title"></button>
        <button id="shutdownBtn" data-i18n="shutdown" data-i18n-title="shutdown_title"></button>
      </span>
      <span class="seg" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-ui-lang="en">EN</button>
        <button type="button" data-ui-lang="vi">VI</button>
      </span>
    </div>
  </div>
  <p class="sub" data-i18n="subtitle"></p>

  <section class="panel">
    <h2 data-i18n="login_h"></h2>
    <div id="tokenStatus" class="muted" data-i18n="checking"></div>
    <div class="row" style="margin-top:10px">
      <input type="password" id="tokenInput" data-i18n-ph="token_ph" autocomplete="off">
      <button id="saveToken" data-i18n="save"></button>
      <button id="checkToken" data-i18n="check"></button>
      <button id="clearToken" data-i18n="clear" data-i18n-title="clear_title"></button>
    </div>
    <details>
      <summary data-i18n="howto"></summary>
      <ol>
        <li data-i18n-html="howto_1"></li>
        <li data-i18n-html="howto_2"></li>
        <li data-i18n-html="howto_3"></li>
        <li data-i18n-html="howto_4"></li>
      </ol>
    </details>
  </section>

  <section class="panel">
    <h2 data-i18n="download_h"></h2>
    <form id="jobForm" class="row">
      <input type="text" id="urlInput" data-i18n-ph="url_ph" required>
      <button type="submit" class="primary" id="startBtn" data-i18n="start"></button>
    </form>
    <div class="row" style="margin-top:10px">
      <span class="muted" data-i18n="caption_langs"></span>
      <label class="chk"><input type="checkbox" name="lang" value="en" checked> English</label>
      <label class="chk"><input type="checkbox" name="lang" value="vi" checked> Tiếng Việt</label>
      <input type="text" id="extraLangs" data-i18n-ph="extra_ph" style="flex:0 1 140px">
      <label class="chk"><input type="checkbox" id="resources" checked> <span data-i18n="resources_label"></span></label>
      <label class="chk"><input type="checkbox" id="force"> <span data-i18n="force_label"></span></label>
    </div>
    <div id="jobBox" hidden style="margin-top:14px">
      <div id="jobHead"></div>
      <div class="bar"><div id="jobBar"></div></div>
      <pre class="log" id="jobLog"></pre>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="courses_h"></h2>
    <div id="courses" class="muted" data-i18n="no_courses"></div>
  </section>
</main>

<script>

let UI = "en";
const T = (key, vars = {}) => (STR[UI][key] ?? STR.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyStatic() {
  document.documentElement.lang = UI;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = T(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = T(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = T(el.dataset.i18nPh);
  for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = T(el.dataset.i18nTitle);
  for (const b of document.querySelectorAll("[data-ui-lang]")) {
    b.classList.toggle("on", b.dataset.uiLang === UI);
    b.setAttribute("aria-pressed", String(b.dataset.uiLang === UI));
  }
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json", "X-Requested-With": "udemy-transcript" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

const saveLang = (lang) => api("/api/settings", { method: "POST", body: JSON.stringify({ ui_lang: lang }) });

async function initLang() {
  const s = await api("/api/settings").catch(() => null);
  if (s && s.saved) {
    UI = s.ui_lang;
  } else {
    // Lần đầu mở: đoán theo trình duyệt rồi lưu lại để log/trang đọc do server sinh ra cũng theo
    UI = (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en";
    saveLang(UI).catch(() => {});
  }
  applyStatic();
}

for (const b of document.querySelectorAll("[data-ui-lang]")) b.onclick = async () => {
  if (b.dataset.uiLang === UI) return;
  UI = b.dataset.uiLang;
  applyStatic();
  if (lastToken) renderToken(lastToken);
  if (lastJob) renderJob(lastJob);
  await saveLang(UI).catch((e) => alertBox(e.message));
  loadCourses();  // sau khi server dựng lại trang đọc khoá theo ngôn ngữ mới
};

let lastToken = null;
function renderToken(tok) {
  lastToken = tok;
  const src = { web: T("src_web"), env: T("src_env"), none: "" }[tok.source];
  let html;
  if (!tok.configured) html = T("no_token_html");
  else if (tok.valid === true) html = `<span class="ok">${esc(T("logged_in", { user: tok.user || "OK" }))}</span> <span class="muted">(${esc(src)})</span>`;
  else if (tok.valid === false) html = `<span class="err">✗ ${esc(tok.error)}</span> <span class="muted">(${esc(src)})</span>`;
  else html = esc(T("has_token", { src }));
  $("tokenStatus").innerHTML = html;
}

async function refreshToken(check) {
  try { renderToken(await api(`/api/token${check ? "?check=1" : ""}`)); }
  catch (e) { $("tokenStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

$("saveToken").onclick = async () => {
  const token = $("tokenInput").value.trim();
  if (!token) return;
  $("tokenStatus").textContent = T("checking");
  try { renderToken(await api("/api/token", { method: "POST", body: JSON.stringify({ token }) })); $("tokenInput").value = ""; }
  catch (e) { $("tokenStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};
$("checkToken").onclick = () => { $("tokenStatus").textContent = T("checking"); refreshToken(true); };
$("clearToken").onclick = async () => renderToken(await api("/api/token", { method: "DELETE" }));

function selectedLangs() {
  const langs = [...document.querySelectorAll('input[name=lang]:checked')].map((x) => x.value);
  for (const x of $("extraLangs").value.split(",")) if (x.trim()) langs.push(x.trim().toLowerCase());
  return [...new Set(langs)];
}

let pollTimer = null;
$("jobForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const langs = selectedLangs();
  if (!langs.length) return alertBox(T("pick_lang"));
  try {
    const job = await api("/api/jobs", { method: "POST", body: JSON.stringify({ url: $("urlInput").value, langs, force: $("force").checked, resources: $("resources").checked }) });
    watchJob(job.id);
  } catch (e) { alertBox(e.message); }
};

function alertBox(msg) {
  lastJob = null;
  $("jobBox").hidden = false;
  $("jobHead").innerHTML = `<span class="err">${esc(msg)}</span>`;
  $("jobBar").style.width = "0";
  $("jobLog").textContent = "";
}

let lastJob = null;
function renderJob(job) {
  lastJob = job;
  const label = T(`job_${job.status}`);
  const cls = { done: "ok", error: "err" }[job.status] || "";
  const count = job.total ? T("job_files", { done: job.done, total: job.total }) : "";
  $("jobHead").innerHTML = `<b class="${cls}">${esc(label)}</b> <span class="muted">${esc(job.slug)}${esc(count)}</span>`;
  $("jobBar").style.width = job.status === "done" ? "100%" : (job.total ? `${(100 * job.done / job.total).toFixed(1)}%` : "0");
  const log = $("jobLog");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = job.logs.join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
  $("startBtn").disabled = job.status === "queued" || job.status === "running";
}

function watchJob(id) {
  clearInterval(pollTimer);
  $("jobBox").hidden = false;
  const tick = async () => {
    let job;
    try { job = await api(`/api/jobs/${id}`); } catch { return; }
    renderJob(job);
    if (job.status === "done" || job.status === "error") { clearInterval(pollTimer); loadCourses(); }
  };
  tick();
  pollTimer = setInterval(tick, 1500);
}

async function loadCourses() {
  const list = await api("/api/courses").catch(() => []);
  if (!list.length) { $("courses").classList.add("muted"); $("courses").textContent = T("no_courses"); return; }
  $("courses").classList.remove("muted");
  $("courses").innerHTML = list.map((c) => {
    const slug = encodeURIComponent(c.slug);
    const pills = c.langs.map((l) => {
      const s = c.stats[l];
      return `<span class="pill">${esc(l)}: ${c.combined[l] || 0}/${c.lecture_count}${s.auto ? ` (${s.auto} auto)` : ""}</span>`;
    }).join("");
    const r = c.resources;
    const resPill = r && (r.files || r.links)
      ? `<span class="pill">📎 ${r.downloaded + r.skipped}/${r.files} file${r.links ? ` · ${r.links} link` : ""}${r.failed ? ` · <span class="err">${esc(T("errors", { n: r.failed }))}</span>` : ""}</span>` : "";
    const view = `/view/${slug}/`;
    const read = c.html ? `<a href="${view}" target="_blank"><b>${esc(T("read"))}</b></a>` : "";
    const overview = c.html && c.overview ? `<a href="${view}overview.html" target="_blank">${esc(T("overview"))}</a>` : "";
    const links = read + overview + c.langs.filter((l) => c.combined[l]).map((l) =>
      (c.html ? `<a href="${view}transcript.${esc(l)}.html" target="_blank">${esc(T("view_lang", { lang: l }))}</a>` : "") +
      `<a href="/api/courses/${slug}/transcript/${esc(l)}?download=1">${esc(T("download_md", { lang: l }))}</a>`).join("");
    const when = new Date(c.updated_at * 1000).toLocaleString(T("locale"));
    return `<div class="course">
      <div class="title">${esc(c.title)}</div>
      ${c.headline ? `<div>${esc(c.headline)}</div>` : ""}
      <div class="muted">${esc(T("course_meta", { chapters: c.chapter_count, lectures: c.lecture_count, when }))}</div>
      <div style="margin-top:6px">${pills}${resPill}</div>
      <div class="links">${links}<a href="/api/courses/${slug}/zip">${esc(T("zip"))}</a>
        ${portable ? `<a href="#" data-slug="${esc(c.slug)}" class="open-folder">${esc(T("open_folder"))}</a>` : ""}
        <a href="#" data-url="${esc(c.url)}" class="reload">${esc(T("update"))}</a></div>
    </div>`;
  }).join("");
  for (const a of document.querySelectorAll("a.open-folder")) a.onclick = (ev) => {
    ev.preventDefault();
    api(`/api/open-folder?slug=${encodeURIComponent(a.dataset.slug)}`, { method: "POST" }).catch((e) => alertBox(e.message));
  };
  for (const a of document.querySelectorAll("a.reload")) a.onclick = (ev) => {
    ev.preventDefault();
    $("urlInput").value = a.dataset.url;
    $("jobForm").requestSubmit();
  };
}

let portable = false;
$("openData").onclick = () => api("/api/open-folder", { method: "POST" }).catch((e) => alertBox(e.message));
$("shutdownBtn").onclick = async () => {
  const busy = (await api("/api/jobs").catch(() => [])).some((j) => j.status === "running" || j.status === "queued");
  if (!confirm(busy ? T("confirm_busy") : T("confirm_quit"))) return;
  await api("/api/shutdown", { method: "POST" }).catch(() => {});
  document.body.innerHTML = `<main><h1>${esc(T("quit_title"))}</h1><p class="sub">${T("quit_body_html")}</p></main>`;
};

(async () => {
  applyStatic();  // điền chữ ngay (tiếng Anh) để trang không trống trong lúc chờ /api/settings
  await initLang();
  const info = await api("/api/app-info").catch(() => ({}));
  portable = !!info.portable;
  $("portableBar").hidden = !portable;
  refreshToken(true);
  loadCourses();
  const running = (await api("/api/jobs").catch(() => [])).find((j) => j.status === "running" || j.status === "queued");
  if (running) watchJob(running.id);
})();
</script>
